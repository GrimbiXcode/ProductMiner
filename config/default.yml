# ProductMiner Configuration

# Redis configuration for Sidekiq
redis:
  host: localhost
  port: 6379
  db: 1

# Database configuration for price storage
database:
  adapter: postgresql
  host: localhost
  port: 5432
  database: product_miner
  username: postgres
  password: postgres
  pool: 5
  timeout: 5000

# Miners configuration
miners:
  migros:
    enabled: true
    base_url: "https://www.migros.ch"
    auth_endpoint: "/authentication/public/v1/api/guest"
    product_endpoint: "/product-display/public/v2/product-detail"
    default_params:
      storeType: "OFFLINE"
      warehouseId: 2
      region: "national"

# Products to monitor (array of product IDs)
products:
  - id: "204451300000"
    name: "Example Product"
    miner: migros
    enabled: true

# Scheduler configuration
scheduler:
  migros:
    cron: "* * * * *"  # Every minute
    enabled: true

# Logging configuration
logging:
  level: info
  file: "log/product_miner.log"
