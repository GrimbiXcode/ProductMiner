name: CI Pipeline

on:
  push:
    branches:
      - main
      - vibe/**
  pull_request:
    branches:
      - main
      - vibe/**

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '3.2.4'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    
    - name: Install dependencies
      run: |
        bundle install
    
    - name: Run tests
      env:
        RACK_ENV: test
      run: bundle exec rspec spec/ --format progress

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.4'
        bundler-cache: true
    
    - name: Install dependencies
      run: bundle install
    
    - name: Run RuboCop
      run: bundle exec rubocop lib/ spec/ --format simple || echo "Linting completed with warnings"

  build:
    name: Build Gem
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.4'
        bundler-cache: true
    
    - name: Install dependencies
      run: bundle install
    
    - name: Build gem
      run: gem build ProductMiner.gemspec
