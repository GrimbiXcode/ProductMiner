name: CI Pipeline

on:
  push:
    branches:
      - main
      - vibe/**
  pull_request:
    branches:
      - main
      - vibe/**

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '3.2.4'
          - '3.1.6'
          - '3.0.7'
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: product_miner_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    
    - name: Install dependencies
      run: |
        sudo apt-get -yqq install libpq-dev
        bundle install
    
    - name: Set up test database
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: postgres
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -c "CREATE DATABASE product_miner_test;" || true
    
    - name: Run linting
      run: bundle exec rubocop lib/ spec/
    
    - name: Run tests
      env:
        RACK_ENV: test
        REDIS_URL: redis://localhost:6379/1
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/product_miner_test
      run: bundle exec rspec spec/ --format documentation --color
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-ruby-${{ matrix.ruby }}
        path: |
          spec/reports/
          .rspec_status

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.4'
        bundler-cache: true
    
    - name: Install dependencies
      run: bundle install
    
    - name: Run RuboCop
      run: bundle exec rubocop lib/ spec/ --format progress --fail-level warning

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.4'
        bundler-cache: true
    
    - name: Install dependencies
      run: bundle install
    
    - name: Run Bundler Audit
      run: |
        gem install bundler-audit
        bundle audit check --update
    
    - name: Run Brakeman (if applicable)
      run: |
        gem install brakeman || true
        brakeman -z . 2>/dev/null || echo "Brakeman not applicable for this project"

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.4'
        bundler-cache: true
    
    - name: Install dependencies
      run: |
        bundle install
        bundle add simplecov --groups test
    
    - name: Run tests with coverage
      env:
        RACK_ENV: test
      run: bundle exec rspec spec/ --format documentation --color --enable-profile
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage/

  build:
    name: Build Gem
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.4'
        bundler-cache: true
    
    - name: Install dependencies
      run: bundle install
    
    - name: Build gem
      run: gem build ProductMiner.gemspec
    
    - name: Upload gem artifact
      uses: actions/upload-artifact@v3
      with:
        name: product-miner-gem
        path: ProductMiner-*.gem
