name: Ruby

on:
  push:
    branches:
      - main
      - vibe/**
  pull_request:
    branches:
      - main
      - vibe/**

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.2.4'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Install dependencies
      run: bundle install
    - name: Run the default task
      run: bundle exec rake
    - name: Run tests
      env:
        RACK_ENV: test
      run: bundle exec rspec spec/ --format documentation --color
